# nginx site — replace example.ir and /srv/rokhsar, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rokhsar
#   sudo ln -s /etc/nginx/sites-available/rokhsar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.ir -d www.example.ir      # free https certificate
server {
    listen 80;
    server_name example.ir www.example.ir;
    client_max_body_size 20M;

    location /media/  { alias /srv/rokhsar/media/;  expires 30d; }
    location /static/ { alias /srv/rokhsar/staticfiles/; expires 365d; access_log off; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
